
name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ "main", "principal" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
      - run: |
          ls -la
          ls -la aplicativo || true
          gradle tasks --all || true
