name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ "main", "principal" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Build Debug APK
        run: |
          chmod +x gradlew
          ./gradlew :aplicativo:assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DamaBrasileiraAI-debug-apk
          path: aplicativo/build/outputs/apk/debug/*.apk
